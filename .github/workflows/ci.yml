# This workflow is base for CI/CD pipelines for the project. It is triggered on push and pull request events to the main branch.
# Eslint and tests are already configured in this workflow. You can add more jobs to this workflow as per your project requirements.
name: ci

on:
  merge_group:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened


jobs:
  eslint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code and configure node
        uses: edp5/edp5-actions/checkout-node@v1.9.0
        with:
          file-version: .nvmrc
          installCommand: npm ci

      - name: Run eslint
        run: npm run lint

